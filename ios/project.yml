name: ShopMate
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ARCHS: arm64
    PRODUCT_BUNDLE_IDENTIFIER: io.shopmate.buyer.ios
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]: '$(inherited) $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework'
    FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]: '$(inherited) $(SRCROOT)/../shared/build/bin/iosArm64/debugFramework'
    OTHER_LDFLAGS: '$(inherited) -framework BuyerCore'
targets:
  ShopMate:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ShopMate
        NSLocalNetworkUsageDescription: 连接同一局域网内的商店开发服务，完成购物与助手体验。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    preBuildScripts:
      - name: Build shared buyer core
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then TARGET=IosSimulatorArm64; else TARGET=IosArm64; fi
          "$SRCROOT/../android/gradlew" -p "$SRCROOT/../android" ":shared:linkDebugFramework$TARGET"
  BuyerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/BuyerAppTests.swift]
    dependencies:
      - target: ShopMate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ShopMate:
    build:
      targets:
        ShopMate: all
    test:
      targets: [BuyerTests]
    run:
      config: Debug
